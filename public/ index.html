<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Online Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="#home" class="logo">ShopEasy</a>
    <nav id="nav">
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="nav-right">
      <span id="authArea"></span>
      <button class="cart-btn" id="cartBtn">🛒 <span id="cartCount">0</span></button>
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
    </div>
  </header>

  <section class="hero" id="home">
    <h1>Shop Smart, Live Better</h1>
    <p>Best deals on electronics, fashion and more.</p>
    <a href="#products" class="btn">Shop Now</a>
  </section>

  <section class="section" id="products">
    <h2>Our Products</h2>
    <div class="filters">
      <input type="text" id="search" placeholder="Search products...">
      <select id="category">
        <option value="all">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Fashion">Fashion</option>
        <option value="Home">Home</option>
      </select>
    </div>
    <div class="grid" id="productGrid"></div>
  </section>

  <div class="overlay" id="overlay"></div>
  <aside class="cart" id="cart">
    <div class="cart-head">
      <h3>Your Cart</h3>
      <button id="closeCart" aria-label="Close cart">✕</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-foot">
      <p>Total: <strong id="cartTotal">₹0</strong></p>
      <button class="btn full" id="checkoutBtn">Place Order</button>
    </div>
  </aside>

  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer class="footer" id="contact">
    <p>ShopEasy &copy; 2026 | Email: support@shopeasy.com</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
